name: quality-gate

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e . -r requirements.txt
      - name: Unit and integration tests
        run: make test
      - name: Build reproducible analysis
        run: make all
      - name: Validate Python syntax
        run: make check
      - name: Upload analytical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-stress-outputs
          path: |
            outputs/
            artifacts/

